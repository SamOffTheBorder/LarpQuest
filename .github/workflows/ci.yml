name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    # The three checks CLAUDE.md requires stay green. `npm run build` reads the
    # environment through lib/env.ts, which refuses to start on invalid
    # configuration — so CI supplies syntactically valid placeholders. These
    # are not secrets and reach nothing: no test or build step makes a network
    # call to Supabase or OpenRouter.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENROUTER_API_KEY: ci-openrouter-key
      # 32 zero bytes, base64 — satisfies the AES-256-GCM length check.
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WORKER_SECRET: ci-worker-secret-value-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # onBrokenLinks is 'throw', so this fails on a bad internal doc link.
      - run: npm run build
